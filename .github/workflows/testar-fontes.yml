name: testar-fontes

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Instalar navegador (para o probe do CEPEA)
        # Sem este passo o probe do CEPEA falha com "BrowserType.launch: Executable
        # doesn't exist", que parece bloqueio do CEPEA e nao e: e navegador faltando.
        run: python -m playwright install --with-deps chromium
      - name: Testar todas as fontes
        run: python probe.py
      - name: Publicar diagnostico
        run: |
          git config user.name  "radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          git commit -m "diagnostico de fontes $(date -u +%F)" || echo "nada novo"
          git push
