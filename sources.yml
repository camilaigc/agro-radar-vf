# sources.yml - montado a partir do diagnostico real de 05/08/2026
# (docs/diagnostico-fontes.json). Nenhuma URL aqui e chute: todas responderam 200
# com itens parseaveis, ou entraram via Google News porque o RSS proprio deu 403/404.

cepea:
  # O widget CEPEA devolve HTTP 403 para requests, mas renderiza normalmente num
  # navegador. Com enabled: true o robo abre um Chromium headless (playwright) no
  # Actions, renderiza o widget oficial e le a tabela. O parser e o mesmo de antes.
  # DESLIGADO em 05/08/2026: as tres estrategias falharam. HTTP 403 na URL direta
  # DENTRO de um Chromium de verdade, 403 no script via servidor local, timeout na
  # pagina publica. Nao e cabecalho: e bloqueio por IP de datacenter, e navegador
  # nao resolve. O widget continua na pagina e funciona, porque roda no navegador de
  # quem visita. Para GRAVAR o valor no historico, ver cepea_canalrural abaixo.
  enabled: false
  # Lista de indicadores. Para acrescentar produto, some &id_indicador%5B%5D=NN
  # aqui: o parser le o nome e a unidade da propria pagina, nao precisa mexer no
  # codigo. Indicadores nesta URL: 2, 77, 12, 178, 179 e 92.
  widget_url: "https://cepea.org.br/br/widgetproduto.js.php?fonte=arial&tamanho=10&largura=400px&corfundo=dbd6b2&cortexto=333333&corlinha=ede7bf&id_indicador%5B%5D=2&id_indicador%5B%5D=77&id_indicador%5B%5D=12&id_indicador%5B%5D=178&id_indicador%5B%5D=179&id_indicador%5B%5D=92"

# --- CEPEA por via indireta: R$/saca e R$/@ ---
# O numero e do CEPEA/ESALQ, mas a leitura e de materia do Canal Rural, cujo RSS
# ja responde 200 aqui. Cada registro sai com e_derivado=true e a ressalva de que
# a data e a de PUBLICACAO da materia, nao necessariamente o dia do indicador.
cepea_canalrural:
  enabled: true
  rss: "https://www.canalrural.com.br/feed"
  max_materias: 3
  max_idade_dias: 5

# --- Cotacoes coletadas pelo robo ---
# Somente endpoints que responderam HTTP 200 no diagnostico de 05/08/2026.
# LME e CME (ureia UFB, MAP MFC) devolvem 403: ureia e MAP NAO tem fonte aberta
# confirmada, logo nao aparecem no painel. LBMA responde 200 mas moveu as tabelas
# de preco para o portal MyLBMA, sem valor na pagina: ouro vem do Trading Economics.
usda_ams:
  # DESLIGADO em 05/08/2026. O layout do PDF mudou e o parser passou a devolver
  # "linha sem preco decimal legivel" para soja, milho e trigo: 6 notas de falha por
  # execucao, zero valor. Os graos agora vem do Trading Economics, convertidos de
  # US centavos/bushel para US$/t. Se um dia voce quiser fechamento OFICIAL de bolsa
  # em vez de referencia CFD, este parser volta, refeito para o layout novo.
  enabled: false
  url: "https://www.ams.usda.gov/mnreports/ams_2850.pdf"
  max_idade_dias: 5

trading_economics:
  enabled: true
  max_idade_dias: 5
  alvos:
    # Ouro saiu daqui: agora vem da LBMA, que e o benchmark oficial e tem JSON
    # estavel. O parser do TE dependia da frase "last updated on <mes> <dia> of <ano>".
    # - {url: "https://tradingeconomics.com/commodity/gold", label: "Ouro"}
    # Cobre em US$/lb foi removido: ficava duplicado com a versao convertida
    # abaixo, que e a que casa com a unidade da serie historica (US$/t).
    - {url: "https://tradingeconomics.com/commodity/iron-ore", label: "Minério de ferro 62% Fe CFR China"}
    # Graos CBOT. Entram aqui porque o parser do USDA AMS quebrou (o layout do PDF
    # mudou: "linha sem preco decimal legivel") e porque o TE ja provou funcionar
    # nesta conta, com cobre e minerio voltando 200 e parseando.
    # O TE cota grao em US centavos por bushel. fator_usd_t converte para US$/t:
    #   soja e trigo: bushel = 27,2155 kg -> 1000/27,2155/100 = 0,367437
    #   milho:        bushel = 25,4012 kg -> 1000/25,4012/100 = 0,393683
    # Conferencia contra o painel de referencia: 1206,7 c/bu x 0,367437 = 443,39 US$/t.
    # faixa_original e guarda: se o TE trocar de unidade, nada e convertido nem publicado.
    - {url: "https://tradingeconomics.com/commodity/soybeans", label: "Soja CBOT",
       fator_usd_t: 0.367437, faixa_original: [700, 2200]}
    - {url: "https://tradingeconomics.com/commodity/corn", label: "Milho CBOT",
       fator_usd_t: 0.393683, faixa_original: [250, 900]}
    - {url: "https://tradingeconomics.com/commodity/wheat", label: "Trigo CBOT (SRW)",
       fator_usd_t: 0.367437, faixa_original: [350, 1400]}
    # Metais. Entram para que TODA serie do historico.json tenha cotacao atual e,
    # com isso, linha de preco no grafico. O TE cota estes em USD/T e USD/t.oz, que
    # sao as mesmas unidades das series do World Bank, entao nao ha conversao.
    - {url: "https://tradingeconomics.com/commodity/silver",    label: "Prata"}
    - {url: "https://tradingeconomics.com/commodity/platinum",  label: "Platina"}
    - {url: "https://tradingeconomics.com/commodity/aluminum",  label: "Alumínio"}
    - {url: "https://tradingeconomics.com/commodity/lead",      label: "Chumbo"}
    - {url: "https://tradingeconomics.com/commodity/tin",       label: "Estanho"}
    - {url: "https://tradingeconomics.com/commodity/nickel",    label: "Níquel"}
    - {url: "https://tradingeconomics.com/commodity/zinc",      label: "Zinco"}
    # Cobre: o TE cota em US$/lb e a serie do World Bank esta em US$/t. Libra ->
    # tonelada e constante fisica (1 t = 2.204,6226 lb), entao a conversao e
    # legitima e destrava a linha do preco atual no grafico. O valor original e a
    # unidade original ficam gravados no registro.
    - {url: "https://tradingeconomics.com/commodity/copper", label: "Cobre",
       fator_usd_t: 2204.6226, faixa_original: [1.5, 15]}
    # Minerio de ferro NAO recebe conversao: o TE cota em US$/t e o World Bank em
    # US$/dmtu (dry metric tonne unit), que depende do teor de Fe. Nao e regra de
    # tres. O grafico dele fica sem linha, com o motivo escrito na tela.

bcb_ptax:
  enabled: true
  url: "https://api.bcb.gov.br/dados/serie/bcdata.sgs.1/dados/ultimos/10?formato=json"
  max_idade_dias: 7
  # O modulo novo busca por intervalo de datas, nao por "ultimos N". Na PRIMEIRA
  # execucao rode o backfill (ver PASSO-A-PASSO, passo 8) para puxar 5 anos.
  dias_backfill: 30

# --- Ouro e prata: LBMA (benchmark oficial, JSON aberto, sem chave) ---
lbma:
  enabled: true
  max_idade_dias: 6          # leilao so em dia util de Londres; feriado longo cabe aqui
  # gold_am.json e silver.json responderam HTTP 200 no probe de 05/08/2026, entao
  # entraram. O ouro AM serve de conferencia independente do PM.
  alvos: ["ouro_pm", "ouro_am", "prata"]

# --- Fertilizantes: serie mensal (ureia, KCl, DAP, TSP, rocha fosfatica) ---
# Espelho da serie World Bank / Fertilizer Week. Atraso normal de 1 a 4 meses,
# por isso tem limite de idade proprio, separado do limite das cotacoes diarias.
indexmundi:
  # DESLIGADO em 05/08/2026. Ele espelha a MESMA serie do World Bank que o coletor
  # do Pink Sheet ja baixa, so que com meses de atraso: chegou a publicar KCl com
  # 157 dias enquanto a serie historica ja estava em julho. Resultado: o site
  # mostrava dois valores para o mesmo indicador. O painel mensal agora sai de
  # painel_do_historico.py, que le o ultimo ponto ja gravado no historico.json.
  # Mantido no arquivo como reserva, caso o Pink Sheet mude de formato.
  enabled: false
  base_url: "https://www.indexmundi.com/commodities/?commodity="
  meses_historico: 60
  # A execucao de 05/08/2026 leu as cinco series sem erro, mas o IndexMundi esta
  # parado em marco/2026: 157 dias de atraso. Com limite 100 tudo era descartado.
  # 200 deixa publicar, e o painel mostra a coluna "Atraso" para o leitor ver que
  # e dado de marco. Preferi mostrar rotulado a esconder.
  max_idade_dias: 200
  alvos:
    - {slug: "urea",                  key: "ureia_wb",           label: "Ureia"}
    - {slug: "potassium-chloride",    key: "kcl_wb",             label: "Cloreto de potássio (KCl)"}
    - {slug: "dap-fertilizer",        key: "dap_wb",             label: "DAP"}
    - {slug: "triple-superphosphate", key: "tsp_wb",             label: "TSP"}
    - {slug: "rock-phosphate",        key: "rocha_fosfatica_wb", label: "Rocha fosfática"}

# --- MAP: nao existe preco de mercado aberto ---
# Entra o valor unitario de importacao do Brasil, marcado como proxy no JSON e
# no painel. NAO e cotacao spot. Nunca comparar contra benchmark sem dizer isso.
comexstat:
  enabled: true
  metrica_valor: "metricFOB"   # metricFOB confirmado funcionando em 05/08/2026
  # Janela CURTA de proposito. Com 24 meses (de 2024-08) a API devolveu exatamente
  # 12 meses e parou em 2025-08, o que tem cara de truncamento da janela, nao de
  # dado atrasado. Com 6 meses, o mes mais recente disponivel deve aparecer.
  meses_historico: 6
  # Estatistica de comercio externo sai com atraso de 1 a 2 meses. 120 dias cobre.
  max_idade_dias: 120
  alvos:
    # ncm8 e o plano B: se o filtro sh6 nao for aceito, o modulo tenta o NCM de 8
    # digitos automaticamente e anota qual variante funcionou.
    - {hs6: "310540", ncm8: "31054000", key: "map_import_br",   label: "MAP e misturas com DAP, valor unitário de importação"}
    - {hs6: "310210", ncm8: "31021010", key: "ureia_import_br", label: "Ureia, valor unitário de importação"}
    - {hs6: "310420", ncm8: "31042010", key: "kcl_import_br",   label: "KCl, valor unitário de importação"}

