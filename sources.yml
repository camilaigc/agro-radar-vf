  "Mineração": [mineracao, mining, minerio, ore, ouro, gold, cobre, copper, litio, lithium, niquel, nickel, bauxita, terras raras, potassa]
  "Agrotóxicos": [defensivo, agrotoxico, crop protection, herbicida, fungicida, inseticida, pesticide, nematicida]
  "Frigoríficos": [frigorifico, abatedouro, abate, desossa, slaughterhouse, carne bovina, carne de frango, carne suina, beef, poultry, pork, proteina animal, bovino, suino, ave de corte, frango, avicultura, aviario]
