# --- Expressoes que NEUTRALIZAM o termo do setor ---
# Sao apagadas do texto ANTES da classificacao. Caso real de 05/08/2026: a materia
# "Golden Age: Morgan ve era de ouro para energia e destaca Petrobras" entrou em
# Mineracao porque "ouro" casou. Apagando "era de ouro", o termo deixa de existir
# para o classificador. O texto exibido no site nao e alterado.
negativas:
  [era de ouro, eras de ouro, regra de ouro, regras de ouro, padrao ouro,
   bodas de ouro, gol de ouro, medalha de ouro, medalhas de ouro, chave de ouro,
   ouro olimpico, golden age, golden share, mina de ouro de, coracao de ouro,
   a peso de ouro, banho de ouro, la vem ouro, bola de ouro, luva de ouro,
   safra de talentos, safra de livros, safra de filmes, colheita de votos,
   moeda de prata, bodas de prata, tela de prata, ponte de prata,
   cana de acucar em pe, mar de lama]

# --- Termos AMBIGUOS ---
# Valem 1 ponto e SO pontuam se houver confirmacao (ver coocorrencia). Termo que
# nao esta nesta lista e considerado inequivoco e vale 2 pontos.
termos_fracos:
  # SO o que e ambiguo DE VERDADE em portugues ou ingles. A primeira versao pos aqui
  # soja, milho, boi, leite, frango, semente e niquel, que nao sao ambiguos, e o
  # resultado foi perder "Grupo do agro com 25 fazendas entra em recuperacao
  # judicial", que e sinal de originacao puro. Termo fora desta lista vale 2 pontos.
  #   safra   -> Banco Safra, safra de talentos
  #   fazenda -> Ministerio da Fazenda, secretaria da Fazenda
  #   cobre   -> verbo cobrir ("o seguro cobre")
  #   cana    -> girias e nomes proprios
  #   seed    -> rodada seed de venture capital
  #   postura -> postura da empresa
  #   mercado -> qualquer mercado
  #   madeira -> Madeira (rio, ilha), Porto Velho
  [ouro, gold, prata, silver, cobre, copper, safra, cana, fazenda, fazendas,
   mercado, postura, madeira, seed, seeds, ativo, ativos, portfolio, grao, graos]

# --- Coocorrencia: o que CONFIRMA um termo ambiguo, por categoria ---
coocorrencia:
