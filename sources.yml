# --- Porta setorial ---
# Fonte marcada trusted:true entra sempre. Fonte generalista (trusted:false) e as
# consultas amplas so entram se o titulo ou o trecho tiver um destes termos. O termo
# que casou fica gravado em cada item, e o que fica de fora NAO e apagado: vai para
# "itens_fora_escopo" no JSON. Cada grupo aponta a micro sugerida.
setores:
  "Indústria de Saúde Animal": [saude animal, animal health, veterinario, veterinaria, veterinary, vacina animal]
  "Nutrição Animal": [nutricao animal, animal nutrition, racao, feed mill, premix, farelo, nucleo proteico]
