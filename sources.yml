# Fonte GENERALISTA precisa deste minimo de pontos para entrar no escopo. Fonte
# setorial (trusted: true) entra com 1. Assim "ouro" numa materia da InfoMoney nao
# basta, mas "garimpo" basta, e "ouro" + "jazida" tambem.
pontos_minimos_generalista: 2

# --- Transacao x noticia ---
# Nao apaga nada: gera tres faixas. >=1 forte, ou >=2 fracas, ou 1 fraca + cifra
# -> transacao. 1 fraca isolada -> possivel_transacao. Nada -> noticia.
transacao:
  # Ajustado depois do teste contra os 590 itens reais de 05/08/2026. A primeira
  # versao marcava como transacao coisas como "Mosaic registra prejuizo" (casou
  # "investimento" + cifra) e "Banco do Brasil linha para aquisicao de maquinas"
  # (casou "compra"). Duas mudancas: as expressoes genericas sairam das fracas, e
  # frase com verbo + artigo entrou nas fortes, porque "adquire a" e operacao e
  # "compra" solto nao e.
  fortes:
    [ato de concentracao, cade aprova, aprovado pelo cade, submetido ao cade,
     contrato de compra e venda, share purchase agreement, spa assinado,
     assume o controle, assumiu o controle, aquisicao de controle,
     compra de participacao, venda de participacao, compra a participacao,
     adquire a, adquiriu a, adquire participacao, anuncia a compra,
     anuncia a aquisicao, fechou a compra, conclui a aquisicao, concluiu a compra,
     acordo para adquirir, acordo para a compra, assina acordo de compra,
     fusao, incorporacao de acoes, cisao parcial, joint venture,
     memorando de entendimento, oferta publica de aquisicao, opa,
     ipo, follow on, oferta subsequente,
     recuperacao judicial, pedido de recuperacao judicial, leilao judicial,
     alienacao de ativos, desinvestimento, venda de ativos,
     capta r, capta us, levanta r, levanta us, aporte de r, aporte de us,
     rodada de investimento, series a, series b, series c,
     acquires, acquisition of, acquired by, definitive agreement, merger with,
     stake sale, majority stake, minority stake, divestment, to acquire]
  fracas:
    [adquire, adquiriu, comprou, vendeu, negocia a venda, negocia a compra,
     aquisicao, aporte, captacao, due diligence, oferta vinculante,
     assessor financeiro, banco de investimento, fundo de private equity,
     buys, sells, acquiring, deal, funding round]

# --- NOMES VIGIADOS ---
# A LISTA NAO VIVE MAIS NESTE ARQUIVO, E DE PROPOSITO.
#
# Este repositorio e PUBLICO: o sources.yml e legivel em
# raw.githubusercontent.com sem autenticacao. A lista anterior nomeava alvos e
# contrapartes de processos em andamento, sob um comentario que declarava
# exatamente o que a lista era. Numa assessoria sell-side isso e exposicao de
# informacao confidencial, nao detalhe de organizacao.
#
# A lista agora vem de fora do repositorio, em ordem de precedencia:
#   1. variavel de ambiente ENTIDADES_VIGIADAS (um nome por linha)
#      -> no GitHub: Settings > Secrets and variables > Actions > New secret
#      -> o workflow injeta o secret como env; nada e commitado
#   2. arquivo apontado por ENTIDADES_VIGIADAS_ARQUIVO (uso local)
#   3. arquivo entidades_vigiadas.local.yml, se existir (esta no .gitignore)
# Sem nenhuma das tres, o mecanismo simplesmente nao roda, e o build avisa.
#
# ATENCAO: remover daqui nao apaga do historico do git. Os commits anteriores
# continuam acessiveis a quem clonar. Resolver isso exige repositorio privado,
# reescrita de historico ou repositorio novo sem historico.

vigiados_min_letras: 4

